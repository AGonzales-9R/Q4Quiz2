<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- SETUP BOOTSTAP: LINK TO BOOTSTRAP -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<!-- LINK TO JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<!-- ADD STYLE -->
	<link rel="stylesheet" type="text/css" href="style.css">

	<title>Quiz 2</title>
</head>
<body>

	<!-- HEADER -->
	<div class="heather">
		<br>	
		<h1>OBMC Score Analyzer</h1>

		<!-- ONTOGGLE EVENT -->
		<details>
			<summary>
				Click here for Grade Guide
			</summary>
			<a href="https://obmfairviewsis.orangeapps.ph/ob/elearning/grades">
				<img src="grading.png" class="grade">
			</a>
			<br>
			<br>
		</details>

		<h4>Enter your grades in the following subjects:</h4>
	</div>

	<br>

	<!-- CONTAINER -->
	<div class="container">
	  <div class="row">

	  	<!-- MATH -->
	    <div class="col md-4 mb-3">
	      <div class="card">
	      	<div class="math">
		      	<a href="https://www.canva.com/design/DAGmPxY_580/dN9UBEqDsCy77-qd9racCw/edit?utm_content=DAGmPxY_580&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton">
		        	<img class="card-img-top" src="1.png" alt="Math">
		        </a>
		        <div class="card-body">
		        	<form>
		        		<input type="number" id="inputMath" class="form-control" placeholder="Enter Your Math Grade">
		        	</form>
		         </div>
		    </div>      
	      </div>
	    </div>

	    <!-- SCIENCE -->
	    <div class="col md-4 mb-3">
	      <div class="card">
	      	<div class="sci">
		      	<a href="https://www.canva.com/design/DAGmPxY_580/dN9UBEqDsCy77-qd9racCw/edit?utm_content=DAGmPxY_580&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton">
		        	<img class="card-img-top" src="2.png" alt="Science">
		        </a>
		        <div class="card-body">
		        	<form>
		        		<input type="number" id="inputSci" class="form-control" placeholder="Enter Your Science Grade">
		        	</form>
	         	</div>
	         </div>	 
	      </div>
	    </div>

	    <!-- SOCIAL STUDIES -->
	    <div class="col md-4 mb-3">
	      <div class="card">
	      	<div class="ss">
		      	<a href="https://www.canva.com/design/DAGmPxY_580/dN9UBEqDsCy77-qd9racCw/edit?utm_content=DAGmPxY_580&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton">
		        	<img class="card-img-top" src="3.png" alt="Social Studies">
		        </a>	
		        <div class="card-body">
		        	<form>
		        		<input type="number" id="inputSS" class="form-control" placeholder="Enter Your Social Studies Grade">
		        	</form>
		         </div>
		     </div>     
	      </div>
	    </div>
	  </div>
	</div>

	<!-- BUTTONS -->
	<div class="buttons">
		
		<button type="button" class="btn btn-dark btn-md" id="gradeAnalyze" onclick="analyze()">Analyze Grades</button>
		<button type="button" class="btn btn-dark btn-md" onclick="window.location.reload()">Refresh</button>

	</div>

	<br>

	<h5><i>Note: Grading Criteria and Equivalents can vary depending on school or district.</i></h5>

	<hr>

	<!-- FOOTER -->
	<footer>
		<h4><span>&#169</span> <a href="https://github.com/AGonzales-9R">Amanda Gonzales</a> | 9-Ruby</h4>
	</footer>

	<!-- JS -->
	<script src="main.js"></script>		

</body>
</html>
